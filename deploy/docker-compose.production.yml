# Production container. Runs on the same app instance, published on port 8080.
# IMAGE and ECR_REGISTRY are provided via environment when `docker compose` runs.
services:
  app-production:
    image: ${ECR_REGISTRY}/${IMAGE}
    container_name: myapp-production
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
